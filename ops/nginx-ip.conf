# VueSmile public IP deployment with a trusted Let's Encrypt IP certificate.
# Install into sites-available, link into sites-enabled, nginx -t, then reload.
# Requires a certificate at the paths below before enabling the HTTPS server.
# Certbot uses /var/lib/letsencrypt for HTTP-01 challenges; renewal reloads nginx.
# Update server_name/root/socket/certificate paths for another host.
server {
    listen 80;
    server_name 13.229.116.230;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://13.229.116.230$request_uri; }
}

server {
    listen 443 ssl;
    server_name 13.229.116.230;
    ssl_certificate /etc/letsencrypt/live/13.229.116.230/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.229.116.230/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VueSmileSSL:10m;
    ssl_session_timeout 1d;
    root /home/pdaleramirez/vuesmiledental/web;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;
    access_log /var/log/nginx/vuesmiledental-access.log;
    error_log /var/log/nginx/vuesmiledental-error.log;
    add_header X-Content-Type-Options nosniff always;

    # Root is handled by Craft's existing redirect; other requests resolve either
    # a static Nuxt file or a Craft route (including authenticated administration).
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
