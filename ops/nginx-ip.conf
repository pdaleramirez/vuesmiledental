# VueSmile temporary IP deployment. Install as /etc/nginx/sites-available/vuesmiledental-ip.conf,
# link into sites-enabled, then run nginx -t before reloading nginx.
# Public server: static Nuxt files and the two read-only Craft content endpoints.
# Admin uses an SSH tunnel to the loopback server until HTTPS is configured.
# Update server_name/root/socket for another host; no other virtual hosts are changed.
server {
    listen 80;
    server_name 13.229.116.230;
    root /home/pdaleramirez/vuesmiledental/web;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;
    access_log /var/log/nginx/vuesmiledental-access.log;
    error_log /var/log/nginx/vuesmiledental-error.log;
    add_header X-Content-Type-Options nosniff always;

    location = / { return 301 /index.html; }
    location ~ ^/api/(homepage|services)$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # These APIs accept no input. Ignore route override query parameters.
        fastcgi_param QUERY_STRING "";
        fastcgi_hide_header X-Powered-By;
    }
    location ^~ /admin { return 403; }
    location ^~ /actions { return 403; }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}

# SSH forwards a local port to this listener; it is never exposed to the internet.
server {
    listen 127.0.0.1:8080;
    server_name localhost 127.0.0.1;
    root /home/pdaleramirez/vuesmiledental/web;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
