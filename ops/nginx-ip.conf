# Legacy IP URLs redirect to the Cloudflare-protected domain.
# Keep HTTP-01 reachable for automatic renewal of the existing IP certificate.
server {
    listen 80;
    server_name 13.229.116.230;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://vuesmiledental.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name 13.229.116.230;
    ssl_certificate /etc/letsencrypt/live/13.229.116.230/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.229.116.230/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://vuesmiledental.com$request_uri;
}
