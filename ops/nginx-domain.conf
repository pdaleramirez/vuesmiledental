# VueSmile domain deployment. Install as /etc/nginx/sites-available/vuesmiledental.com.conf.
# Requires the domain certificate, Cloudflare real-IP snippet and rate-limit zones.
# HTTP-01 remains reachable so Certbot can renew without changing firewall rules.
server {
    listen 80;
    server_name vuesmiledental.com www.vuesmiledental.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://vuesmiledental.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.vuesmiledental.com;
    ssl_certificate /etc/letsencrypt/live/vuesmiledental.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vuesmiledental.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://vuesmiledental.com$request_uri;
}

server {
    listen 443 ssl;
    server_name vuesmiledental.com;
    ssl_certificate /etc/letsencrypt/live/vuesmiledental.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vuesmiledental.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VueSmileSSL:10m;
    ssl_session_timeout 1d;
    root /home/pdaleramirez/vuesmiledental/web;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 20m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    include /etc/nginx/snippets/vuesmile-cloudflare-realip.conf;
    # Reject direct-origin requests so this hostname cannot bypass Cloudflare.
    # The geo map uses the original TCP peer, not the user-supplied visitor header.
    if ($vuesmile_cloudflare_peer = 0) { return 403; }
    access_log /var/log/nginx/vuesmiledental-access.log;
    error_log /var/log/nginx/vuesmiledental-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include /etc/nginx/snippets/vuesmile-php-protection.conf;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
