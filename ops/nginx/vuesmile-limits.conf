# Load once in nginx's http context: /etc/nginx/conf.d/30-vuesmile-limits.conf.
# Limits apply only to virtual hosts/locations that explicitly reference these zones.
# POSTs to Craft login are limited separately; static files are never rate limited.
# $request_uri preserves the original path after Craft's index.php rewrite.
map "$request_method:$request_uri:$arg_action" $vuesmile_login_key {
    default "";
    ~^POST:/admin/(login|actions/users/login)(\?|:) $binary_remote_addr;
    ~^POST:/actions/users/login(\?|:) $binary_remote_addr;
    ~^POST:[^:]*:users/login$ $binary_remote_addr;
}
limit_req_zone $vuesmile_login_key zone=vuesmile_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=vuesmile_php:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vuesmile_connections:10m;
