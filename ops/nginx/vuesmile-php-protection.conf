# Include inside this site's location = /index.php after loading the zones above.
# Example: include /etc/nginx/snippets/vuesmile-php-protection.conf;
# Per visitor: 5 dynamic requests/second, burst 20; 5 login POSTs/minute, burst 5.
# A trusted Cloudflare real-IP include must be loaded in each proxied server block.
# Excess traffic returns HTTP 429; cached/static Nuxt assets remain unrestricted.
limit_req zone=vuesmile_php burst=20 nodelay;
limit_req zone=vuesmile_login burst=5 nodelay;
limit_req_status 429;
limit_conn vuesmile_connections 20;
limit_conn_status 429;
