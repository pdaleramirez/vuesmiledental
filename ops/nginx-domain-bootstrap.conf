# Initial certificate issuance only; install before requesting the domain certificate.
# DNS must point to this server. Replace with nginx-domain.conf after issuance.
# Only public ACME tokens are served until HTTPS is ready.
server {
    listen 80;
    server_name vuesmiledental.com www.vuesmiledental.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 503; }
}
